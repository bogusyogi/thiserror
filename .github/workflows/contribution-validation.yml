name: Lightcraft HDR fresh fallback regression
on:
  push:
    branches: [codex/contribution-checks]
permissions:
  contents: read
jobs:
  hdr_fresh_fallback_regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "1"
      CASE_ID: hdr
      CANDIDATE_SHA: b017b6c6969f841db507caaca0eec710a9b84eb1
      ORIGINAL_HEAD_SHA: a6ab093e834efe4cd0f60150ede9bf80cd5bbdb4
    steps:
      - name: Check out validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out HDR PR base with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/lightcraft
          ref: ${{ env.ORIGINAL_HEAD_SHA }}
          fetch-depth: 0
          path: ember
          persist-credentials: false
      - name: Fetch and pin HDR PR candidate
        shell: bash
        working-directory: ember
        run: |
          set -euo pipefail
          bundle="../harness/.github/regressions/lightcraft-hdr-candidate.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor "$ORIGINAL_HEAD_SHA" "$CANDIDATE_SHA"
          [[ -z "$(git status --porcelain)" ]]
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - name: Install and verify Rust 1.98.0
        shell: bash
        working-directory: ember
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          rustc --version | tee "$RUNNER_TEMP/lightcraft-hdr-rustc-version.txt"
          grep -Eq '^rustc 1\.98\.0([ -]|$)' "$RUNNER_TEMP/lightcraft-hdr-rustc-version.txt"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ember
          shared-key: lightcraft-hdr-hosted
          cache-on-failure: true
      - name: Run HDR fresh fallback red then green proof
        shell: bash
        run: bash harness/.github/scripts/validate-lightcraft-regression.sh
      - name: Upload HDR regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lightcraft-hdr-fresh-fallback-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lightcraft-hdr-evidence/
          if-no-files-found: error
          retention-days: 14