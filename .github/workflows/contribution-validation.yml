name: Contribution regression validation
on:
  bindgen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bogusyogi/rust-bindgen
          ref: 1d54e596eaebbfd28de12c92acd094de6a868d66
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install libclang
        working-directory: source
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Token and macro regressions
        working-directory: source
        shell: bash
        run: |
          cargo test -p bindgen --lib token_line_continuations
          cargo test -p bindgen-tests --test tests macro
  ureq:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bogusyogi/ureq-proto
          ref: 3d394ac4d955749cbccfcde10ef389820f415a77
          path: ureq-proto
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bogusyogi/ureq
          ref: 7db8b56be06347cae17f58f2037aa14919b8fb85
          path: ureq
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Protocol tests
        working-directory: ureq-proto
        shell: bash
        run: |
          cargo test --all-features
      - name: Client integration against protocol patch
        working-directory: ureq
        shell: bash
        run: |
          cargo --config 'patch.crates-io.ureq-proto.path="../ureq-proto"' update -p ureq-proto --precise 0.6.4
          cargo --config 'patch.crates-io.ureq-proto.path="../ureq-proto"' test --lib
          cargo --config 'patch.crates-io.ureq-proto.path="../ureq-proto"' test --doc
  thiserror_green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bogusyogi/thiserror
          ref: eb83b07960266f0e8470e2b32fe77fe977868f2b
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Full crate tests
        working-directory: source
        shell: bash
        run: cargo test
  async_trait_green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bogusyogi/async-trait
          ref: 89e49d48c1fb56f9df42f94fa30fb3109e7bcb18
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Full crate tests
        working-directory: source
        shell: bash
        run: cargo test
  cygwin:
    runs-on: windows-latest
    timeout-minutes: 40
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bogusyogi/BLAKE3
          ref: d9ff95c098d65002c35dfbff423d9a78086658cd
          path: source
          persist-credentials: false
      - uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52
        with:
          install-dir: 'D:\cygwin'
          packages: rustc cargo gcc-core gcc-g++
          add-to-path: false
      - name: Native Cygwin ABI and vectors
        working-directory: source
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr {0}
        run: |
          export PATH=/usr/bin:/bin
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-pc-cygwin
          cargo test --target x86_64-pc-cygwin
          cargo test --manifest-path test_vectors/Cargo.toml --target x86_64-pc-cygwin
